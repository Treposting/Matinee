name: Matinee

options:
  bundleIdPrefix: com.nahid
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    # Re-enable together with Developer ID signing and notarization. Ad-hoc signed builds
    # with hardened runtime can't load the embedded Sparkle framework (library validation).
    ENABLE_HARDENED_RUNTIME: NO

targets:
  Matinee:
    type: application
    platform: macOS
    sources:
      - path: Matinee
        excludes:
          - "**/.gitkeep"
          - Info.plist
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Matinee
        PRODUCT_BUNDLE_IDENTIFIER: com.nahid.matinee
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Matinee/Info.plist
        # Sparkle: the updater stays off until SPARKLE_PUBLIC_KEY is set (see docs/RELEASING.md).
        SPARKLE_FEED_URL: https://github.com/Treposting/Matinee/releases/latest/download/appcast.xml
        SPARKLE_PUBLIC_KEY: "nVK1+sFh1I+45S2zZ/qGT8SYYardII8GyR9tqPMggr8="
        INFOPLIST_KEY_CFBundleDisplayName: Matinee
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""

  MatineeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MatineeTests
    dependencies:
      - target: Matinee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nahid.matinee.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Matinee:
    build:
      targets:
        Matinee: all
        MatineeTests: [test]
    test:
      targets:
        - MatineeTests
