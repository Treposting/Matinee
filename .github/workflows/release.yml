name: Release

# Publishes a release whenever MARKETING_VERSION in project.yml changes on main to a version
# that has no release yet (pushing a tag like v0.2.0 still works too). The appcast.xml
# attached to the latest release is the feed every installed copy of Matinee checks.
on:
  push:
    branches: [main]
    # The workflow file is listed so a fix to it retries a version that failed to publish.
    paths: [project.yml, .github/workflows/release.yml]
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -nE 's/^ *MARKETING_VERSION: *"?([0-9]+\.[0-9]+\.[0-9]+)"?.*/\1/p' project.yml | head -1)
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Couldn't read a version like 1.2.3"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Matinee $VERSION is already released; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      SPARKLE_VERSION: 2.10.0
      VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Set build number
        run: |
          # Sparkle compares CFBundleVersion, so it must grow with every release.
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Releasing $VERSION (build ${{ github.run_number }})"

      - name: Check signing key is configured
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::Add the SPARKLE_PRIVATE_KEY repository secret (see docs/RELEASING.md)"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build release app
        run: |
          xcodebuild build \
            -project Matinee.xcodeproj \
            -scheme Matinee \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_IDENTITY=- \
            | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Check app is configured for updates
        run: |
          PLIST=build/Build/Products/Release/Matinee.app/Contents/Info.plist
          KEY=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$PLIST" 2>/dev/null || true)
          if [ -z "$KEY" ]; then
            echo "::error::SPARKLE_PUBLIC_KEY is empty in project.yml, so this build could never update itself"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/Matinee.app "Matinee-$VERSION.zip"

      # The DMG is for people installing by hand; Sparkle updates use the zip above.
      - name: Make disk image
        run: |
          mkdir dmg
          ditto build/Build/Products/Release/Matinee.app dmg/Matinee.app
          ln -s /Applications dmg/Applications
          # On CI runners hdiutil intermittently fails ("Resource busy", "No such file or
          # directory"), so retry with a growing pause.
          for attempt in $(seq 1 8); do
            hdiutil create -volname Matinee -srcfolder dmg -fs HFS+ -format UDZO -ov \
              "Matinee-$VERSION.dmg" && break
            [ "$attempt" = 8 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Download Sparkle tools
        run: |
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir sparkle-tools
          tar -xJf sparkle.tar.xz -C sparkle-tools

      - name: Sign update and write appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SIGNATURE=$(printf '%s' "$SPARKLE_PRIVATE_KEY" \
            | sparkle-tools/bin/sign_update --ed-key-file - "Matinee-$VERSION.zip")
          DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Matinee-$VERSION.zip"
          cat > appcast.xml <<APPCAST
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Matinee</title>
              <item>
                <title>Matinee $VERSION</title>
                <pubDate>$(date -R)</pubDate>
                <sparkle:version>$BUILD</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>27.0</sparkle:minimumSystemVersion>
                <link>https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG</link>
                <enclosure url="$DOWNLOAD_URL" type="application/octet-stream" $SIGNATURE />
              </item>
            </channel>
          </rss>
          APPCAST
          cat appcast.xml

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" \
            "Matinee-$VERSION.dmg" "Matinee-$VERSION.zip" appcast.xml \
            --title "Matinee $VERSION" \
            --generate-notes
